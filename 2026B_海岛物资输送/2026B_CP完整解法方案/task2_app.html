<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026B 任务2 · 在线CP决策模型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.app{max-width:1350px;margin:0 auto;padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.header h1{font-size:1.15rem;color:#f8fafc}.badge{background:#1e293b;padding:2px 10px;border-radius:4px;font-size:.68rem;color:#94a3b8}
.main{display:grid;grid-template-columns:minmax(440px,1fr) 340px;gap:12px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:#1e293b;border-radius:10px;padding:12px}
.grid-wrap{position:relative;width:100%;aspect-ratio:1;max-width:500px;margin:0 auto}
.grid-bg{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%;border:1px solid #334155}
.cell{border:1px solid #1e293b;background:#0f172a}
.mk{position:absolute;transform:translate(-50%,-50%);z-index:2;font-weight:700;font-size:.6rem;text-align:center;pointer-events:none}
.mk.ship{width:22px;height:22px;background:#f59e0b;border-radius:50%;border:2px solid #fbbf24;box-shadow:0 0 12px rgba(245,158,11,.5);z-index:5;font-size:0;transition:all .3s}
.mk.sup{width:20px;height:20px;background:#10b981;border-radius:5px;color:#fff;line-height:20px;font-size:.58rem;border:2px solid #34d399}
.mk.wrk{width:20px;height:20px;background:#6366f1;border-radius:50%;color:#fff;line-height:20px;font-size:.58rem;border:2px solid #818cf8}
.mk.bgn{width:20px;height:20px;background:#3b82f6;border-radius:3px;color:#fff;line-height:20px;font-size:.55rem;border:2px solid #60a5fa}
.mk.end{width:22px;height:22px;background:#ef4444;border-radius:3px;color:#fff;line-height:22px;font-size:.55rem;border:2px solid #f87171}
.right{display:flex;flex-direction:column;gap:10px}
.card{background:#1e293b;border-radius:10px;padding:12px}
.card h3{font-size:.73rem;color:#94a3b8;margin-bottom:7px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:.68rem}
.row .l{color:#94a3b8;width:16px}.row .b{flex:1;height:5px;background:#334155;border-radius:3px;margin:0 7px;overflow:hidden}
.row .f{height:100%;border-radius:3px;transition:width .3s}.row .v{width:40px;text-align:right;font-variant-numeric:tabular-nums}
.fO{background:#f59e0b}.fH{background:#3b82f6}.fF{background:#10b981}.fM{background:#a78bfa}.fZ{background:#f472b6}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.si{background:#0f172a;border-radius:5px;padding:6px;text-align:center}
.si .sv{font-size:1.05rem;font-weight:700;color:#f8fafc}
.si .sl{font-size:.58rem;color:#64748b;margin-top:1px}
.btn-row{display:flex;gap:5px;flex-wrap:wrap}
button{padding:6px 12px;border:none;border-radius:5px;cursor:pointer;font-size:.7rem;font-weight:500;transition:all .15s}
button:disabled{opacity:.3;cursor:not-allowed}
.bs{background:#3b82f6;color:#fff}.ba{background:#10b981;color:#fff}.br{background:#ef4444;color:#fff}
.bw{background:#334155;color:#e2e8f0;padding:5px 8px;font-size:.65rem}
.bw.sel{background:#166534;color:#86efac;border:1px solid #4ade80}
.bw.selT{background:#991b1b;color:#fca5a5;border:1px solid #f87171}
.log{max-height:160px;overflow-y:auto;font-size:.6rem;font-family:monospace}
.log .ll{padding:2px 0;border-bottom:1px solid #1e293b;color:#94a3b8}
.ll.dc{color:#f59e0b}.ll.sp{color:#10b981}.ll.ar{color:#f472b6}.ll.wk{color:#a5b4fc}
.wp{display:flex;gap:3px;align-items:center;font-size:.68rem;color:#94a3b8;margin-top:5px}
.info{font-size:.62rem;color:#64748b;line-height:1.35}.info span{color:#94a3b8;font-weight:600}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><h1>2026B 任务2 · 在线CP决策模型</h1><div class="badge">观测w<sub>t</sub> → CP重规划 → a<sub>t</sub>* → S<sub>t+1</sub></div></div></div>
<div class="main">
<div class="panel"><div class="grid-wrap" id="gridContainer"><div class="grid-bg" id="gridBg"></div><svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none" id="trailSvg"></svg></div></div>
<div class="right">
<div class="card"><h3>资源</h3>
<div class="row"><span class="l">O</span><div class="b"><div class="f fO" id="barO" style="width:29%"></div></div><span class="v" id="valO">35</span></div>
<div class="row"><span class="l">H</span><div class="b"><div class="f fH" id="barH" style="width:37%"></div></div><span class="v" id="valH">45</span></div>
<div class="row"><span class="l">F</span><div class="b"><div class="f fF" id="barF" style="width:25%"></div></div><span class="v" id="valF">30</span></div>
<div class="row"><span class="l" style="color:#a78bfa">M</span><div class="b"><div class="f fM" id="barM" style="width:32%"></div></div><span class="v" id="valM" style="color:#a78bfa">240</span></div>
<div class="row"><span class="l" style="color:#f472b6">Z</span><div class="b"><div class="f fZ" id="barZ" style="width:20%"></div></div><span class="v" id="valZ" style="color:#f472b6">100</span></div>
</div>
<div class="card"><h3>状态</h3>
<div class="sg">
<div class="si"><div class="sv" id="statDay">0</div><div class="sl">天/30</div></div>
<div class="si"><div class="sv" id="statPos">B(1,5)</div><div class="sl">位置</div></div>
<div class="si"><div class="sv" id="statW">—</div><div class="sl">天气</div></div>
<div class="si"><div class="sv" id="statLoad">110</div><div class="sl">载重/120</div></div>
<div class="si"><div class="sv" id="statCo">0</div><div class="sl">连续作业</div></div>
<div class="si"><div class="sv" id="statWd">—</div><div class="sl">本点作业</div></div>
</div>
<div class="wp"><span>下日天气:</span><button class="bw" id="btnN" onclick="pickW('N')">正常</button><button class="bw selT" id="btnT" onclick="pickW('T')">雷暴</button></div>
</div>
<div class="btn-row">
<button class="bs" id="btnStep" onclick="step()">▶ 执行</button>
<button class="ba" id="btnAuto" onclick="toggleAuto()">⏩ 自动</button>
<button class="br" onclick="reset()">↺ 重置</button>
</div>
<div class="card"><h3>日志</h3><div class="log" id="logList"><div class="ll">就绪</div></div></div>
<div class="card"><h3>CP规划</h3><div class="info">路径: <span id="cpPath">—</span></div><div class="info">估Z: <span id="cpZ">—</span> M: <span id="cpM">—</span> 节点: <span id="cpN">—</span></div></div>
</div></div></div>
<script>
// ===== CONFIG =====
const XY=[[1,5],[10,5],[2,7],[5,3],[8,8],[3,4],[7,6]],NM=['B','E','W1','W2','W3','S1','S2'];
const WY=[20,15,28],WM=[4,5,3],MD=30,ML=120;
const CONS={N:{MO:2,MH:3,MF:2,PO:1,PH:1,PF:1,WO:5,WH:4,WF:3,pO:2,pH:1,pF:2},T:{MO:8,MH:4,MF:3,PO:3,PH:3,PF:2,WO:8,WH:6,WF:6,pO:2,pH:1,pF:2}};
const DT=Array.from({length:7},(_,i)=>Array.from({length:7},(_,j)=>Math.abs(XY[i][0]-XY[j][0])+Math.abs(XY[i][1]-XY[j][1])));
const IT=[2,3,4,5,6];

// ===== STATE =====
let S,WS,AT,TP,PW,NXW,CPINIT;
function is(){return{pt:0,pos:[...XY[0]],O:35,H:45,F:30,M:240,Z:100,co:0,day:0,pl:null,lg:0,si:0,pi:0,wpI:0,wdD:0};}

// ===== CP ENGINE =====
function mw(mc,r){let b=Math.min(mc,r);for(let k=1;k<=r+1;k++){let s=k*mc+(k-1);if(s>r)break;b=Math.max(b,k*mc);let sl=r-s;if(sl>=1)b=Math.max(b,k*mc+Math.min(mc,sl-1));}return b;}
function ep(n,m){let c=[];function r(p,rm,cu){if(p===n-1){cu[p]=rm;c.push([...cu]);return;}for(let i=0;i<=rm;i++){cu[p]=i;r(p+1,rm-i,cu);}}r(0,m,new Array(n).fill(0));return c;}
function sim(pid,wd,ps,init,cs){
  let m=pid.length-2,wa=[],ww=[];
  for(let i=1;i<pid.length;i++){if(pid[i]>=2&&pid[i]<=4){wa.push(i);ww.push(pid[i]-2);}}
  let tt=0;for(let k=0;k<=m;k++)tt+=DT[pid[k]][pid[k+1]];
  let T=tt+(wd?wd.reduce((a,b)=>a+b,0):0)+(ps?ps.reduce((a,b)=>a+b,0):0)+100;
  let cO=new Array(T).fill(0),cH=new Array(T).fill(0),cF=new Array(T).fill(0),zG=new Array(T).fill(0),iS=new Array(T).fill(false),day=0;
  for(let k=0;k<=m;k++){let d=DT[pid[k]][pid[k+1]];for(let pd=0;pd<(ps?ps[k]:0);pd++){cO[day]=cs.PO;cH[day]=cs.PH;cF[day]=cs.PF;day++;}
    for(let dd=0;dd<d;dd++){cO[day]=cs.MO;cH[day]=cs.MH;cF[day]=cs.MF;day++;if(dd===d-1&&(pid[k+1]===5||pid[k+1]===6))iS[day-1]=true;}
    if(wd){let wk=wa.indexOf(k+1);if(wk>=0&&wd[wk]>0){let mc=WM[ww[wk]],yl=WY[ww[wk]],rm=wd[wk];while(rm>0){let ch=Math.min(rm,mc);for(let w=0;w<ch;w++){cO[day]=cs.WO;cH[day]=cs.WH;cF[day]=cs.WF;zG[day]=yl;day++;}rm-=ch;if(rm>0){cO[day]=cs.PO;cH[day]=cs.PH;cF[day]=cs.PF;day++;}}}}}
  let Ta=day,O=init.O,H=init.H,F=init.F,M=init.M,Z=init.Z;
  for(let t=0;t<Ta;t++){O-=cO[t];H-=cH[t];F-=cF[t];Z+=zG[t];if(O<0||H<0||F<0)return{ok:false};if(O+H+F>ML+1e-9)return{ok:false};
    if(iS[t]){let ns=Ta;for(let tt=t+1;tt<Ta;tt++){if(iS[tt]){ns=tt;break;}}let nO=0,nH=0,nF=0;for(let tt=t+1;tt<=ns;tt++){if(tt>=Ta)break;nO+=cO[tt];nH+=cH[tt];nF+=cF[tt];}
    let sp=ML-(O+H+F),bO=Math.max(0,nO-O),bH=Math.max(0,nH-H),bF=Math.max(0,nF-F);if(bO+bH+bF>sp)return{ok:false};if(ns>=Ta&&(O+bO<nO||H+bH<nH||F+bF<nF))return{ok:false};
    let cost=bO*cs.pO+bH*cs.pH+bF*cs.pF;if(cost>M)return{ok:false};O+=bO;H+=bH;F+=bF;M-=cost;}}
  return{ok:true,Z,M};
}
function cpS(path,tsf,wa,ww,best,cs,nd,rd){
  nd.c++;let lp=path[path.length-1];
  if(lp!==1){let dE=DT[lp][1],rem=rd-tsf;if(rem<dE)return;let ub=CPINIT.Z+mw(3,rem-dE)*28;if(ub<=best.Z&&best.Z>-Infinity)return;}
  let dE=DT[lp][1];if(tsf+dE<=rd){let fp=[...path,1],m=fp.length-2,tt=0;for(let k=0;k<=m;k++)tt+=DT[fp[k]][fp[k+1]];let rD=rd-tt;
    if(wa.length===0){let nS=m+1,cm=ep(nS+1,rD);for(let ps of cm){let pt=ps.slice(0,nS);let r=sim(fp,[],pt,CPINIT,cs);if(r.ok&&(r.Z>best.Z||(r.Z===best.Z&&r.M>best.M))){best.Z=r.Z;best.M=r.M;best.path=[...fp];best.wd=[];best.ps=[...pt];}}}
    else{let nw=wa.length,mWk=wa.map((_,j)=>mw(WM[ww[j]],rD)),sz=mWk.map(x=>x+1),nc=sz.reduce((a,b)=>a*b,1);
      for(let ci=0;ci<nc;ci++){let wd=new Array(nw).fill(0),t2=ci;for(let j=nw-1;j>=0;j--){wd[j]=t2%sz[j];t2=Math.floor(t2/sz[j]);}
        let ts=0;for(let j=0;j<nw;j++){if(wd[j]>0)ts+=wd[j]+Math.max(0,Math.ceil(wd[j]/WM[ww[j]])-1);}if(tt+ts>rd)continue;
        let pr=rd-tt-ts,nS=m+1,cm=ep(nS,pr);for(let ps of cm){if(tt+ts+ps.reduce((a,b)=>a+b,0)>rd)continue;
          let r=sim(fp,wd,ps,CPINIT,cs);if(r.ok&&(r.Z>best.Z||(r.Z===best.Z&&r.M>best.M))){best.Z=r.Z;best.M=r.M;best.path=[...fp];best.wd=[...wd];best.ps=[...ps];}}}}}
  for(let np of IT){if(np===lp)continue;let d=DT[lp][np];if(tsf+d>rd)continue;let de2=DT[np][1];if(tsf+d+de2>rd)continue;
    let nwa=[...wa],nww=[...ww];if(np>=2&&np<=4){nwa.push(path.length+1);nww.push(np-2);}cpS([...path,np],tsf+d,nwa,nww,best,cs,nd,rd);}
}
function cpPlan(curPt,cs,remDays){
  CPINIT={O:S.O,H:S.H,F:S.F,M:S.M,Z:S.Z};
  let best={Z:-Infinity,M:-Infinity,path:[curPt,1],wd:[],ps:[]},nd={c:0};
  cpS([curPt],0,[],[],best,cs,nd,remDays);
  return{fe:best.Z>-Infinity,path:best.path,pa:best.ps,wo:best.wd,nd:nd.c,eZ:best.Z,eM:best.M};
}

// ===== DAILY DECISION =====
function step(){
  if(S.day>=MD||S.pt===1){if(S.pt===1)log('已在终点E','ar');return;}
  let w=NXW||WS[S.day];NXW=null;
  let cs=CONS[w],wn=w==='T'?'雷暴':'正常',wc=(w!==PW),dt='';
  S.day++;let act='',supplied=false;

  // Replan on weather change or no plan
  if(!S.pl||wc){
    let remD=MD-(S.day-1);
    S.pl=cpPlan(S.pt,cs,remD);S.lg=0;S.si=0;S.pi=0;S.wpI=0;S.wdD=0;
    if(!S.pl.fe){log('Day '+S.day+': 无可行方案','');upd();PW=w;return;}
    if(wc||S.day===1){log('CP重规划(天气='+wn+' 剩余'+remD+'天): '+S.pl.path.map(i=>NM[i]).join('→')+' | Z估='+S.pl.eZ+' M估='+S.pl.eM+' 节点'+S.pl.nd,'dc');updCP();}
  }
  let pl=S.pl,np=pl.path[S.lg+1];

  // Decision: work → park-at-sea → move
  let isWP=(S.pt>=2&&S.pt<=4);
  let needWork=isWP&&S.wpI<pl.wo.length&&S.wdD<pl.wo[S.wpI];
  if(needWork){
    let wkT=S.pt-2,wm=WM[wkT],yl=WY[wkT];
    if(S.co<wm){
      act='作业@'+NM[S.pt];S.O-=cs.WO;S.H-=cs.WH;S.F-=cs.WF;S.Z+=yl;S.co++;S.wdD++;
      if(S.wdD>=pl.wo[S.wpI]){S.wpI++;S.wdD=0;}
    }else{
      act='停泊(重置)@'+NM[S.pt];S.O-=cs.PO;S.H-=cs.PH;S.F-=cs.PF;S.co=0;
    }
  }else if(pl.pa&&S.lg<pl.pa.length&&S.pi<pl.pa[S.lg]){
    act='停泊(海上)';S.O-=cs.PO;S.H-=cs.PH;S.F-=cs.PF;S.co=0;S.pi++;
  }else if(S.si<DT[S.pt][np]){
    S.O-=cs.MO;S.H-=cs.MH;S.F-=cs.MF;S.co=0;S.si++;
    let fr=XY[S.pt],to=XY[np],dx=to[0]-fr[0],dy=to[1]-fr[1],sx=Math.abs(dx),sy=Math.abs(dy),st=S.si,dT=sx+sy;
    if(st<=sx){S.pos[0]=fr[0]+Math.sign(dx)*st;S.pos[1]=fr[1];}else{S.pos[0]=to[0];S.pos[1]=fr[1]+Math.sign(dy)*(st-sx);}
    act='移动→('+S.pos[0]+','+S.pos[1]+')';
    if(S.si>=dT){
      S.pt=np;S.pos=[...XY[np]];S.si=0;S.pi=0;
      if(np>=2&&np<=4){let wc=0;for(let i=1;i<=S.lg+1;i++){if(pl.path[i]>=2&&pl.path[i]<=4)wc++;}S.wpI=wc-1;S.wdD=0;}
      if(np===5||np===6){
        let rT=0,rP=0;for(let k=S.lg;k<pl.path.length-2;k++){rT+=DT[pl.path[k+1]][pl.path[k+2]];if(k+2<(pl.pa?pl.pa.length:0))rP+=pl.pa[k+1];}
        let nO=rT*cs.MO+rP*cs.PO,nH=rT*cs.MH+rP*cs.PH,nF=rT*cs.MF+rP*cs.PF;
        let wi=S.wpI;for(let k=S.lg+1;k<pl.path.length-1;k++){if(pl.path[k]>=2&&pl.path[k]<=4&&wi<pl.wo.length){let wd=pl.wo[wi];if(wd>0){let pk=Math.max(0,Math.ceil(wd/WM[pl.path[k]-2])-1);nO+=wd*cs.WO+pk*cs.PO;nH+=wd*cs.WH+pk*cs.PH;nF+=wd*cs.WF+pk*cs.PF;}wi++;}}
        let sp=ML-(S.O+S.H+S.F),bO=Math.max(0,nO-S.O),bH=Math.max(0,nH-S.H),bF=Math.max(0,nF-S.F);
        if(bO+bH+bF<=sp){let cost=bO*cs.pO+bH*cs.pH+bF*cs.pF;if(cost<=S.M){S.O+=bO;S.H+=bH;S.F+=bF;S.M-=cost;act='补给@'+NM[np];dt='+O'+Math.round(bO)+'+H'+Math.round(bH)+'+F'+Math.round(bF)+' 花'+Math.round(cost);supplied=true;}}
      }
      S.lg++;
    }
  }
  if(S.O<-1||S.H<-1||S.F<-1){act='⚠资源耗尽';log('Day '+S.day+': 资源耗尽！','');}if(S.O+S.H+S.F>ML+1){act='⚠超载';log('Day '+S.day+': 超载！','');}
  if(supplied)log('Day '+S.day+': '+act+' | '+dt+' | M='+Math.round(S.M),'sp');
  else if(act.includes('作业'))log('Day '+S.day+': '+act+' | '+wn+' | O='+Math.round(S.O)+' H='+Math.round(S.H)+' Z='+S.Z,'wk');
  else if(S.pt===1||act.includes('E'))log('Day '+S.day+': ★ '+act+' Z='+S.Z+' M='+Math.round(S.M),'ar');
  else log('Day '+S.day+': '+act+' | '+wn+' | O='+Math.round(S.O)+' H='+Math.round(S.H)+' Z='+S.Z,'');
  TP.push([...S.pos]);PW=w;upd();
  document.getElementById('btnN').className='bw';document.getElementById('btnT').className='bw';
}

function toggleAuto(){if(AT){clearInterval(AT);AT=null;document.getElementById('btnAuto').textContent='⏩ 自动';return;}document.getElementById('btnAuto').textContent='⏸ 停止';AT=setInterval(()=>{if(S.day>=MD||S.pt===1){toggleAuto();return;}step();},400);}
function reset(){if(AT)toggleAuto();S=is();TP=[[...XY[0]]];PW=null;NXW=null;document.getElementById('logList').innerHTML='<div class="ll">已重置</div>';document.getElementById('cpPath').textContent='—';document.getElementById('cpZ').textContent='—';document.getElementById('cpM').textContent='—';document.getElementById('cpN').textContent='—';upd();renderAll();}
function pickW(w){NXW=w;document.getElementById('btnN').className='bw'+(w==='N'?' sel':'');document.getElementById('btnT').className='bw'+(w==='T'?' selT':'');}

// ===== UI =====
function upd(){
  document.getElementById('statDay').textContent=S.day;document.getElementById('statPos').textContent=NM[S.pt]+'('+S.pos[0]+','+S.pos[1]+')';
  let w=WS[Math.min(S.day-1,MD-1)]||'—',wn=w==='T'?'雷暴':w==='N'?'正常':'—';
  document.getElementById('statW').textContent=S.day>0?wn:'—';document.getElementById('statW').style.color=w==='T'?'#fca5a5':w==='N'?'#86efac':'#64748b';
  document.getElementById('statLoad').textContent=Math.round(S.O+S.H+S.F)+'/120';
  document.getElementById('statCo').textContent=S.co;
  let wkI=(S.pt>=2&&S.pt<=4)?S.pt-2:-1;
  document.getElementById('statWd').textContent=wkI>=0&&S.wpI<S.pl?.wo?.length?S.wdD+'/'+S.pl.wo[S.wpI]:'—';
  document.getElementById('barO').style.width=(S.O/ML*100).toFixed(1)+'%';document.getElementById('valO').textContent=Math.round(S.O);
  document.getElementById('barH').style.width=(S.H/ML*100).toFixed(1)+'%';document.getElementById('valH').textContent=Math.round(S.H);
  document.getElementById('barF').style.width=(S.F/ML*100).toFixed(1)+'%';document.getElementById('valF').textContent=Math.round(S.F);
  document.getElementById('barM').style.width=(Math.max(0,S.M)/240*100).toFixed(1)+'%';document.getElementById('valM').textContent=Math.round(S.M);
  document.getElementById('barZ').style.width=(S.Z/500*100).toFixed(1)+'%';document.getElementById('valZ').textContent=S.Z;
  document.getElementById('btnStep').disabled=(S.day>=MD||S.pt===1);
  renderTrail();renderShip();
}
function updCP(){let p=S.pl;if(!p)return;document.getElementById('cpPath').textContent=p.path.map(i=>NM[i]).join(' → ');document.getElementById('cpZ').textContent=p.eZ;document.getElementById('cpM').textContent=p.eM;document.getElementById('cpN').textContent=p.nd;}
function log(msg,cl){let d=document.createElement('div');d.className='ll'+(cl?' '+cl:'');d.textContent=msg;let l=document.getElementById('logList');l.appendChild(d);l.scrollTop=l.scrollHeight;}

function renderAll(){
  let c=document.getElementById('gridContainer'),g=document.getElementById('gridBg');g.innerHTML='';
  for(let r=0;r<10;r++)for(let cc=0;cc<10;cc++){let ce=document.createElement('div');ce.className='cell';g.appendChild(ce);}
  c.querySelectorAll('.mk:not(.ship)').forEach(e=>e.remove());
  let mk=[{i:0,cl:'bgn',l:'B'},{i:1,cl:'end',l:'E'},{i:2,cl:'wrk',l:'W1'},{i:3,cl:'wrk',l:'W2'},{i:4,cl:'wrk',l:'W3'},{i:5,cl:'sup',l:'S1'},{i:6,cl:'sup',l:'S2'}];
  for(let m of mk){let d=document.createElement('div');d.className='mk '+m.cl;d.textContent=m.l;let[x,y]=XY[m.i];d.style.left=(x/10*100).toFixed(1)+'%';d.style.top=((11-y)/10*100).toFixed(1)+'%';c.appendChild(d);}
  let s=c.querySelector('.mk.ship');if(!s){s=document.createElement('div');s.className='mk ship';c.appendChild(s);}renderShip();renderTrail();
}
function renderShip(){let s=document.getElementById('gridContainer').querySelector('.mk.ship');if(!s)return;s.style.left=(S.pos[0]/10*100).toFixed(1)+'%';s.style.top=((11-S.pos[1])/10*100).toFixed(1)+'%';}
function renderTrail(){let svg=document.getElementById('trailSvg');if(TP.length<2){svg.innerHTML='';return;}let h='';for(let i=1;i<TP.length;i++){let[x1,y1]=TP[i-1],[x2,y2]=TP[i];h+='<line x1="'+(x1/10*100).toFixed(1)+'%" y1="'+((11-y1)/10*100).toFixed(1)+'%" x2="'+(x2/10*100).toFixed(1)+'%" y2="'+((11-y2)/10*100).toFixed(1)+'%" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" opacity="0.4"/>';}svg.innerHTML=h;}

WS=Array(MD).fill('T');S=is();TP=[[...XY[0]]];PW=null;
window.addEventListener('resize',renderAll);renderAll();upd();
</script>
</body>
</html>
