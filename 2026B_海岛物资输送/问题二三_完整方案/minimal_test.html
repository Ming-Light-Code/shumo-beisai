<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<h3>Minimal Test</h3><pre id="out">Loading...</pre>
<script>
try {
var A=[[1,5],[10,5],[2,7],[5,3],[8,8],[3,4],[7,6]];
var N=['B','E','W1','W2','W3','S1','S2'];
var WY=[20,15,28],WM=[4,5,3];
var P=[0,2,6,4,6,1],D=[3,6,3,3,4];
var W=[3,0,6,0,0];
var x=1,y=5,o=35,h=45,f=30,m=240,z=100,g=1,st=0,c=0,done=false,fin=false,day=1;
var log='';
function na(a,b){for(var i=0;i<7;i++)if(A[i][0]===a&&A[i][1]===b)return i;return -1}

for(var t=0;t<50&&!fin;t++){
 if(day>30){log+='OVER30\n';break}
 var wx='normal',co=0,ch=0,cf=0,zg=0,bo=0,bh=0,bf=0,dx=0,dy=0,act='',nd=false;
 var nid=na(x,y);
 if(nid===1){fin=true;act='Arrive@E!';nd=true}
 else if(g<=D.length&&nid===P[g]){
  if((nid===5||nid===6)&&!done){
   var ro=0,rh=0,rf=0;
   for(var k=g+1;k<=D.length;k++){
    ro+=D[k-1]*2;rh+=D[k-1]*3;rf+=D[k-1]*2;
    if(W[k-1]>0){var wd=W[k-1],wp=P[k]-2,wc=(wp>=0&&wp<3)?WM[wp]:1;
     ro+=wd*5;rh+=wd*4;rf+=wd*3;if(wd>wc){var ni=Math.ceil(wd/wc)-1;ro+=ni;rh+=ni;rf+=ni}}
    }
    var np=P[k];if(np===5||np===6)break;
   }
   var no=Math.max(0,Math.ceil(ro-o)),nh=Math.max(0,Math.ceil(rh-h)),nf=Math.max(0,Math.ceil(rf-f));
   if(no+nh+nf>120-(o+h+f)){co=1;ch=1;cf=1;act='Idle@'+N[nid]+'(pb)'}
   else{bo=no;bh=nh;bf=nf;var ct=bo*2+bh*1+bf*2;if(ct<=m){act='Buy@'+N[nid]+' O:'+bo+' H:'+bh+' F:'+bf;done=true;g++;st=0;c=0;nd=true}else{fin=true;act='NoMoney'}}
  }else if(nid>=2&&nid<=4&&W[g-1]>0){
   var wt=nid-2;
   if(c<WM[wt]){co=5;ch=4;cf=3;zg=WY[wt];c++;W[g-1]--;act='Work@'+N[nid]+'('+c+'/'+WM[wt]+')'}
   else{co=1;ch=1;cf=1;c=0;act='Idle@'+N[nid]+'(rst)'}
   if(W[g-1]<=0){g++;st=0;c=0;done=false}
  }
 }else{
  if(g<=D.length){
   var tp=P[g],tx=A[tp][0],ty=A[tp][1];
   if(x<tx)dx=1;else if(x>tx)dx=-1;else if(y<ty)dy=1;else if(y>ty)dy=-1;
   co=2;ch=3;cf=2;st++;c=0;act='Move->('+(x+dx)+','+(y+dy)+')';
  }
 }
 x+=dx;y+=dy;o=o-co+bo;h=h-ch+bh;f=f-cf+bf;
 if(bo+bh+bf>0)m-=(bo*2+bh*1+bf*2);z+=zg;
 if(o<0||h<0||f<0||m<0||o+h+f>120){log+='FAIL d'+day+'\n';break}
 log+='D'+day+' ('+x+','+y+') '+act+' o:'+o+' h:'+h+' f:'+f+' m:'+m+' z:'+z+'\n';
 if(!nd)day++;
}
log+='\nFINAL: Z='+z+' M='+m;
document.getElementById('out').textContent=log;
}catch(e){document.getElementById('out').textContent='ERROR: '+e.message}
</script>
</body></html>
